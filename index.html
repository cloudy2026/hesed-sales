/* Brand filters and sales trend */
.brand-tag{display:inline-block;border:1px solid transparent;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.2;font-weight:750;white-space:nowrap;vertical-align:middle}
.brand-tag.katsu{color:#674c15;background:#f5edda;border-color:#ebdfc3}
.brand-tag.karis{color:#563b72;background:#f0eaf9;border-color:#e6d9f3}
.table-wrap tbody tr.selected-branch{outline:2px solid #ad842d;outline-offset:-2px}
.table-link[aria-pressed=true]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
#trend{min-width:0;scroll-margin-top:100px}.trend-panel{height:100%;--trend-grid:#e8e3d9;--rise:#23734e;--fall:#b6313a;--even:#656051}
.trend-panel .panel-head{align-items:center}.trend-panel .panel-head h2{line-height:1.4}
.trend-info{display:flex;gap:8px 14px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;min-height:28px;margin:0 0 12px;font-size:13px;color:var(--muted)}
.trend-legend{display:flex;align-items:center;gap:12px;white-space:nowrap;font-weight:750}.trend-readout strong{font-weight:800}
.trend-up{color:var(--rise)}.trend-down{color:var(--fall)}.trend-even{color:var(--even)}
.trend-chart{display:grid;grid-template-columns:45px minmax(0,1fr);gap:8px;height:205px;margin:0 0 22px}
.trend-axis{position:relative;color:var(--muted);font-size:11px;text-align:right}
.trend-axis span{position:absolute;right:0;transform:translateY(-50%)}
.trend-plot{position:relative}.trend-plot>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.trend-plot line{stroke:currentColor;stroke-width:3px;stroke-linecap:round}.trend-plot line.trend-grid{stroke:var(--trend-grid);stroke-width:1px;stroke-linecap:butt}
.trend-month{position:absolute;display:block;top:0;left:var(--x);width:8.25%;height:100%;padding:0;border:0;background:none;transform:translateX(-50%);cursor:pointer}.trend-month:hover,.trend-month:focus-visible{background:#9e87561c;border-radius:4px}
.trend-point,.trend-missing{position:absolute;top:var(--y);left:50%;transform:translate(-50%,-50%);pointer-events:none}
.trend-point{width:10px;height:10px;border:2px solid var(--paper);border-radius:50%;background:currentColor;box-shadow:0 0 0 1px currentColor}.trend-month:hover .trend-point,.trend-month:focus-visible .trend-point{width:14px;height:14px}
.trend-missing{font-size:18px;line-height:1;color:var(--muted)}
.trend-month-label{position:absolute;left:50%;top:calc(100% + 7px);font-size:12px;transform:translateX(-50%);white-space:nowrap;color:var(--muted)}

<body>
<div class="shell">
  <header class="workbar">
    <div class="brand"><span class="brandmark" aria-hidden="true"></span><strong>헤세드 매출관리</strong></div>
    <nav aria-label="주 메뉴">
      <button data-view="overview" class="active"><span data-icon="dashboard"></span>대시보드</button>
      <button data-view="monthly"><span data-icon="calendar"></span>월별 입력</button>
      <button data-view="import"><span data-icon="upload"></span>파일 가져오기</button>
      <button data-view="stores"><span data-icon="store"></span>매장 관리</button>
    </nav>
    <div class="top-actions"><button type="button" class="button secondary" data-action="theme" aria-pressed="false">블랙 모드</button><button type="button" class="button primary" id="export"><span data-icon="download"></span>CSV 내보내기</button></div>
  </header>
  <main>
    <div id="content" class="body" tabindex="-1"></div>
  </main>
</div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const SEED = {"stores":[],"vals":{},"years":["2026"]};
'use strict';

function readCsv(text) {
  const first = text.replace(/^\uFEFF/, '').split(/\r?\n/, 1)[0];
  const delimiter = first.includes('\t') ? '\t' : first.includes(';') && !first.includes(',') ? ';' : ',';
  const rows = [];
  let row = [], value = '', quoted = false;
  for (let i = text.charCodeAt(0) === 0xFEFF ? 1 : 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (quoted && text[i + 1] === '"') { value += '"'; i++; }
      else if (quoted || value === '') quoted = !quoted;
      else value += c;
    } else if (!quoted && (c === delimiter || c === '\n' || c === '\r')) {
      row.push(value);
      value = '';
      if (c !== delimiter) {
        rows.push(row);
        row = [];
        if (c === '\r' && text[i + 1] === '\n') i++;
      }
    } else value += c;
  }
  if (quoted) throw Error('CSV에 닫히지 않은 따옴표가 있습니다.');
  if (value || row.length) rows.push([...row, value]);
  return rows;
}

async function openZip(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  let end = bytes.length - 22;
  while (end >= 0 && view.getUint32(end, true) !== 0x06054b50 && end >= bytes.length - 65557) end--;
  if (end < Math.max(0, bytes.length - 65557) || view.getUint32(end, true) !== 0x06054b50) throw Error('파일을 읽을 수 없습니다. 암호 또는 보호를 해제하고 XLSX나 CSV로 다시 저장해 주세요.');
  let at = view.getUint32(end + 16, true);
  const files = new Map();
  for (let n = 0; n < view.getUint16(end + 10, true); n++) {
    if (view.getUint32(at, true) !== 0x02014b50) throw Error('엑셀 압축 구조를 읽을 수 없습니다.');
    const nameLength = view.getUint16(at + 28, true);
    const name = new TextDecoder().decode(bytes.subarray(at + 46, at + 46 + nameLength));
    files.set(name, {
      flags: view.getUint16(at + 8, true), method: view.getUint16(at + 10, true),
      compressed: view.getUint32(at + 20, true), size: view.getUint32(at + 24, true),
      pos: view.getUint32(at + 42, true)
    });
    at += 46 + nameLength + view.getUint16(at + 30, true) + view.getUint16(at + 32, true);
  }
  return async name => {
    const info = files.get(name);
    if (!info) return null;
    if ((info.flags & 1) || info.size > 50_000_000) throw Error('암호가 없고 압축 해제 크기가 50MB 이하인 파일로 다시 저장해 주세요.');
    const start = info.pos + 30 + view.getUint16(info.pos + 26, true) + view.getUint16(info.pos + 28, true);
    const source = bytes.slice(start, start + info.compressed);
    if (info.method === 0) return new TextDecoder().decode(source);
    if (info.method !== 8) throw Error('지원하지 않는 엑셀 압축 형식입니다.');
    const stream = new Blob([source]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  };
}

function xml(text) {
  const doc = new DOMParser().parseFromString(text || '', 'application/xml');
  if (doc.querySelector('parsererror')) throw Error('엑셀에서 필요한 시트 정보를 읽을 수 없습니다.');
  return doc;
}

function tags(doc, name) { return [...doc.getElementsByTagNameNS('*', name)]; }
function texts(doc) { return tags(doc, 't').map(el => el.textContent).join(''); }

async function openSpreadsheet(file) {
  if (file.size > 25_000_000) throw Error('25MB 이하인 파일로 나누어 올려 주세요.');
  if (/\.(csv|tsv|txt)$/i.test(file.name)) {
    const raw = await file.arrayBuffer();
    let text;
    try { text = new TextDecoder('utf-8', {fatal:true}).decode(raw); }
    catch { text = new TextDecoder('euc-kr').decode(raw); }
    return { names: ['CSV'], read: async () => readCsv(text) };
  }
  if (!/\.xlsx$/i.test(file.name)) throw Error('XLSX 또는 CSV 파일을 사용해 주세요. 구형 XLS는 엑셀에서 다른 이름으로 저장할 수 있습니다.');
  const get = await openZip(await file.arrayBuffer());
  const [book, rel, shared] = await Promise.all([get('xl/workbook.xml'), get('xl/_rels/workbook.xml.rels'), get('xl/sharedStrings.xml')]);
  const relations = new Map(tags(xml(rel), 'Relationship').map(node => [node.getAttribute('Id'), node.getAttribute('Target')]));
  const sheets = tags(xml(book), 'sheet').map(node => ({
    name:node.getAttribute('name'),
    target:relations.get([...node.attributes].find(a => a.localName === 'id')?.value)
  })).filter(s => s.target);
  const strings = shared ? tags(xml(shared), 'si').map(texts) : [];
  return { names:sheets.map(s => s.name), read:async index => {
    const target = sheets[index].target;
    const path = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    return tags(xml(await get(path)), 'row').map(el => {
      const row = [];
      row.line = Number(el.getAttribute('r'));
      for (const cell of tags(el, 'c')) {
        const letters = (cell.getAttribute('r') || '').match(/^[A-Z]+/)?.[0];
        if (!letters) continue;
        const column = [...letters].reduce((n,c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
        const value = tags(cell, 'v')[0]?.textContent ?? '';
        const type = cell.getAttribute('t');
        row[column] = type === 's' ? strings[Number(value)] : type === 'inlineStr' ? texts(cell) : value;
      }
      return row;
    });
  }};
}

function parseAmount(value) {
  const cleaned = String(value ?? '').trim().replace(/[\s₩원]/g, '');
  if (!/^[+-]?(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.0+)?$/.test(cleaned)) return null;
  const number = Number(cleaned.replace(/,/g,''));
  return Number.isSafeInteger(number) ? number : null;
}

function monthParts(value, defaultYear) {
  const v = String(value ?? '').trim();
  const full = v.match(/^(\d{4})\s*[-/.년]\s*(\d{1,2})(?=$|\D)/)
    || v.match(/^(\d{4})(\d{2})(?:\d{2})?$/);
  if (full && +full[2] >= 1 && +full[2] <= 12) return [full[1], +full[2]];
  const short = v.match(/^(\d{1,2})\s*월?$/);
  if (short && +short[1] >= 1 && +short[1] <= 12) return [defaultYear, +short[1]];
  if (/^\d{5}(?:\.\d+)?$/.test(v) && +v >= 20000 && +v <= 90000) {
    const date = new Date(Date.UTC(1899,11,30) + Math.floor(+v) * 86400000);
    return [String(date.getUTCFullYear()), date.getUTCMonth() + 1];
  }
  return null;
}

'use strict';

const $ = (selector, root = document) => root.querySelector(selector);
const channels = ['홀 매출', '배달의민족', '요기요', '쿠팡이츠', '배달특급', '땡겨요'];
const monthList = Array.from({length:12}, (_, i) => i + 1);
const labels = {overview:'매출 대시보드', monthly:'월별 매출 입력', import:'매출 파일 가져오기', stores:'매장 관리'};
const storageKey = 'hesed-sales-desk-v1';
const baseYears = Array.from({length:10}, (_, i) => String(2026+i));
const threshold = 100_000_000;
const brands = [['katsu','카츠헤세드'],['karis','카리스']];
const brandName = brand => brands.find(([id])=>id===brand)?.[1] || '카츠헤세드';
const num = new Intl.NumberFormat('ko-KR');
const icons = {
  dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-14 5h3m4 0h3"/>',
  upload:'<path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4M12 16V3m-5 5 5-5 5 5"/>',
  download:'<path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4M12 3v13m-5-5 5 5 5-5"/>',
  store:'<path d="M3 9l2-5h14l2 5v3c-2 2-4 2-6 0-2 2-4 2-6 0-2 2-4 2-6 0V9zm2 5v6h14v-6M10 20v-5h4v5M3 9h18"/>',
  won:'<path d="m3 5 4 14 5-11 5 11 4-14M2 10h20M3 14h18"/>',
  bag:'<path d="M5 8h14l2 12H3L5 8zM9 9V6a3 3 0 0 1 6 0v3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  grip:'<path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3"/>',
  up:'<path d="m6 15 6-6 6 6"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v6m4-6v6"/>',
  search:'<circle cx="10" cy="10" r="5"/><path d="m14 14 5 5"/>'
};
function icon(name) {
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + (icons[name] || '') + '</svg>';
}
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const yearLabel = y => y + '년';
const storeLabel = k => k === 'franchise' ? '가맹점' : '직영점';
const money = v => v == null ? '<span class="missing">—</span>' : num.format(v);
const won = v => v == null ? '—' : num.format(v) + '원';
const selected = (a,b) => String(a) === String(b) ? ' selected' : '';
const options = (pairs, value) => pairs.map(([id, title]) => '<option value="' + esc(id) + '"' + selected(id, value) + '>' + esc(title) + '</option>').join('');
const key = (y,m,s,c) => [y,m,s,c].join('|');
function safeState(input) {
  if (!input || !Array.isArray(input.stores) || !Array.isArray(input.years) || !input.vals || typeof input.vals !== 'object') throw Error('백업 구조가 올바르지 않습니다.');
  const ids = new Set(), names = new Set(), years = new Set(input.years);
  if (!years.size || [...years].some(y => typeof y !== 'string' || !/^(unknown|20\d\d)$/.test(y))) throw Error('백업의 연도 정보를 확인해 주세요.');
  for (const store of input.stores) {
    if (!store || typeof store.id !== 'string' || !/^[\w-]+$/.test(store.id) || typeof store.name !== 'string' || !store.name.trim() || store.name.length > 40 || ids.has(store.id) || names.has(store.name.trim()) || !['direct','franchise'].includes(store.kind) || (store.deleted != null && typeof store.deleted !== 'boolean')) throw Error('백업의 매장 정보를 확인해 주세요.');
    ids.add(store.id); names.add(store.name.trim());
  }
  for (const [id, amount] of Object.entries(input.vals)) {
    const [year, month, store, ch, extra] = id.split('|');
    if (extra !== undefined || !years.has(year) || !/^(?:[1-9]|1[012])$/.test(month) || !ids.has(store) || !/^[0-5]$/.test(ch) || !Number.isSafeInteger(amount)) throw Error('백업의 매출 정보를 확인해 주세요.');
  }
  return {
    stores:input.stores.map(store=>({...store,brand:brands.some(([id])=>id===store.brand) ? store.brand : store.name==='성수' ? 'karis' : 'katsu'})),
    years:[...new Set([...baseYears,...input.years.filter(year=>+year>=2026)])],
    vals:Object.fromEntries(Object.entries(input.vals).filter(([id])=>+id.split('|',1)[0]>=2026))
  };
}
let state = safeState(SEED);
let loadError = '';
try {
  const saved = localStorage.getItem(storageKey);
  if (saved) {
    state = safeState(JSON.parse(saved));
    const migrated = JSON.stringify(state);
    if (saved !== migrated) localStorage.setItem(storageKey,migrated);
  }
} catch { loadError = '브라우저 저장소를 완전히 읽거나 갱신하지 못했습니다.'; }

const ui = {view:'overview', year:'2026', month:10, period:'all', group:'all', search:'', reorder:false, brand:'all', trendStore:null, channelsExpanded:false};
const toast = $('#toast');
let toastTimer;
function notify(message) {
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3800);
}
async function commit(next, message) {
  try {
    localStorage.setItem(storageKey, JSON.stringify(next));
    state = next;
    loadError = '';
    if (message) notify(message);
    return true;
  } catch {
    notify('브라우저에 저장할 수 없습니다. 저장 권한 또는 남은 용량을 확인해 주세요.');
    return false;
  }
}
function collect(y, months, stores) {
  const amounts = Array(6).fill(null);
  for (const month of months) for (const store of stores) for (let ch = 0; ch < 6; ch++) {
    const value = state.vals[key(y, month, store.id, ch)];
    if (value !== undefined) amounts[ch] = (amounts[ch] ?? 0) + value;
  }
  const total = list => list.some(v => v !== null) ? list.reduce((a,b) => a + (b ?? 0),0) : null;
  return {amounts, hall:amounts[0], delivery:total(amounts.slice(1)), total:total(amounts)};
}
const activeStores = () => ['direct','franchise'].flatMap(kind=>state.stores.filter(s=>s.kind===kind && !s.deleted));
const groupStores = () => activeStores().filter(s=>(ui.group==='all' || ui.group===s.kind) && (ui.brand==='all' || ui.brand===s.brand));
const visibleStores = () => groupStores().filter(s => s.name.toLowerCase().includes(ui.search.toLowerCase().trim()));
const orderedYears = () => [...state.years].sort((a,b)=>+a - +b);
const yearOptions = () => options(orderedYears().map(y => [y, yearLabel(y)]), ui.year);
const monthOptions = value => options(monthList.map(m => [m,m+'월']), value);

function movement(current, previous) {
  if (current === null || previous === null) return {kind:'even',label:'전월 비교 없음'};
  const delta = current - previous;
  if (!delta) return {kind:'even',label:'— 보합'};
  const up = delta > 0;
  const rate = previous > 0 ? ' (' + (Math.abs(delta)/previous*100).toLocaleString('ko-KR',{maximumFractionDigits:1}) + '%)' : '';
  return {kind:up?'up':'down',label:(up?'▲ 상승 ':'▼ 하락 ') + won(Math.abs(delta)) + rate};
}
function monthlyChart(summary,store) {
  const data = summary.map(m=>m.total);
  const min = Math.min(0,...data.filter(n=>n!==null));
  const max = Math.max(0,...data.filter(n=>n!==null));
  const rawStep = (max-min)/4 || 1;
  const magnitude = 10**Math.floor(Math.log10(rawStep));
  const step = ([1,2,2.5,5,10].find(x=>x>=rawStep/magnitude) || 10)*magnitude;
  const top = Math.max(step,Math.ceil(max/step)*step);
  const bottom = Math.floor(min/step)*step;
  const unit = Math.max(top,-bottom)>=100_000_000 ? 100_000_000 : Math.max(top,-bottom)>=10_000 ? 10_000 : 1;
  const axisNum = new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2});
  const levels = Array.from({length:Math.round((top-bottom)/step)+1},(_,i)=>top-i*step);
  const toY = value => (top-value)/(top-bottom)*100;
  const axis = levels.map(level=>'<span style="top:'+toY(level)+'%">'+axisNum.format(level/unit)+'</span>').join('');
  const grid = levels.map(level=>'<line class="trend-grid" x1="0" x2="120" y1="'+toY(level)+'" y2="'+toY(level)+'" vector-effect="non-scaling-stroke"/>').join('');
  const coords = data.map((v,i)=>({x:i*10+5,y:v===null?null:toY(v)}));
  const lines = coords.slice(1).map((p,i)=>{
    const prev = coords[i];
    if (p.y===null || prev.y===null) return '';
    return '<line class="trend-' + movement(data[i+1],data[i]).kind + '" x1="' + prev.x + '" y1="' + prev.y + '" x2="' + p.x + '" y2="' + p.y + '" vector-effect="non-scaling-stroke"/>';
  }).join('');
  const dots = coords.map((p,i)=>{
    const m = summary[i];
    const change = movement(m.total,data[i-1] ?? null);
    const detail = m.total===null ? '미입력' : '총매출 ' + won(m.total) + ' · ' + change.label;
    return '<button class="trend-month trend-' + change.kind + '" data-action="trend-month" data-value="' + (i+1) +
      '" aria-label="' + esc((i+1)+'월 '+detail) + '" title="' + esc(detail) + '" style="--x:' + (p.x/1.2) + '%;--y:' + (p.y ?? 100) + '%">' +
      (p.y===null?'<span class="trend-missing">·</span>':'<span class="trend-point"></span>') + '<span class="trend-month-label">' + (i+1) + '월</span></button>';
  }).join('');
  const comparisons = data.slice(1).map((v,i)=>({month:i+2,diff: v!==null && data[i]!==null ? v-data[i] : null}))
    .filter(r=>r.diff!==null);
  const recent = comparisons.at(-1);
  const recentMove = recent ? movement(data[recent.month-1],data[recent.month-2]) : null;
  const title = store ? esc(store.name)+' 월별 매출 추이' : '전체 매장 월별 매출 추이';
  const suffix = store ? ' · '+brandName(store.brand)+' · '+storeLabel(store.kind) : '';
  const details = store ? button('월별 상세','trend-details','secondary small','','data-value="'+esc(store.id)+'"') +
    button('전체 매장 보기','trend-reset','secondary small') : '';
  return '<section class="panel trend-panel">' + panelHead(title,yearLabel(ui.year)+suffix+' · '+(unit===1e8?'억원':unit===10000?'만원':'원'),'<div class="actions">'+details+'</div>') +
    '<div class="panel-body"><div class="trend-info"><div class="trend-legend" aria-label="전월 대비"><span class="trend-up">▲ 상승</span><span class="trend-down">▼ 하락</span><span class="trend-even">— 보합</span></div>' +
    (recentMove ? '<span class="trend-readout trend-'+recentMove.kind+'">'+recent.month+'월 전월 대비 <strong>'+recentMove.label+'</strong></span>' : '<span class="trend-readout">비교 가능한 월이 없습니다.</span>') +
    '</div><div class="trend-chart"><div class="trend-axis" aria-hidden="true">'+axis+'</div><div class="trend-plot"><svg viewBox="0 0 120 100" preserveAspectRatio="none" aria-hidden="true">'+grid+lines+'</svg>'+dots+'</div></div></div></section>';
}

    (sections || '<tbody><tr><td class="blank" colspan="' + columns + '">표시할 매장이 없습니다.</td></tr></tbody>') + footer + '</table></div>';

async function moveStore(id,target,edge) {
  const from = state.stores.find(s=>s.id===id && !s.deleted);
  const to = state.stores.find(s=>s.id===target && !s.deleted);
  if (!from || !to || from===to || from.kind!==to.kind) return;
  const stores = state.stores.filter(s=>s!==from);
  stores.splice(stores.indexOf(to)+(edge==='after'?1:0),0,from);
  if (await commit({...state,stores},from.name + ' 매장 순서를 저장했습니다.')) {
    const table = $('#store-table');
    if (!table) return;
    table.innerHTML = storeTable();
    $('#store-table [data-action="move-store"][data-value="' + from.id + '"]:not([disabled])')?.focus({preventScroll:true});
  }
}

function applyTheme(theme,save=false) {
  const black = theme === 'black';
  document.documentElement.dataset.theme = black?'black':'light';
  document.querySelector('meta[name=theme-color]').content = black?'#000000':'#f4f3ef';
  document.querySelectorAll('[data-action=theme]').forEach(toggle=>{
    toggle.setAttribute('aria-pressed',String(black));
    toggle.textContent = black?'라이트 모드':'블랙 모드';
  });
  if (save) try { localStorage.setItem('hesed-sales-theme',black?'black':'light'); } catch {}
}

function previewImport() {
  invalidatePreview();
  const out = $('#import-preview');
  const fail = message => { out.innerHTML = '<div class="notice alert">' + esc(message) + '</div>'; };
  const val = id => $(id).value;
  const amountCol = val('#amount-col'), dateCol = val('#date-col'), storeSelect = val('#import-store'), storeCol = val('#store-col');
  const statusCol = val('#import-mode') === 'detail' ? val('#status-col') : '';
  const channel = +val('#channel'), year = val('#import-year'), month = +val('#import-month');
  const detail = val('#import-mode') === 'detail';
  if (!upload || upload.header < 0 || amountCol === '' || (storeSelect === 'column' && storeCol === '') || !storeSelect) {
    fail('헤더 행과 매장명·매출액 열을 확인해 주세요.'); return;
  }
  const active = activeStores();
  const amounts = new Map();
  let skipped = 0, cancelled = 0, entries = 0;
  const issues = [];
  const normalize = name => String(name ?? '').trim().replace(/\s+/g,'').toLowerCase();
  for (const [i,row] of upload.rows.entries()) {
    if (i <= upload.header || !row.some(v => String(v ?? '').trim() !== '')) continue;
    const rowName = row.line || i+1;
    if (row.some(v => /^(총\s*합계|총\s*매출|소\s*계|합\s*계|총\s*계|요약|total)(?:\s*[(:：].*)?$/i.test(String(v ?? '').trim()))) { skipped++; continue; }
    if (statusCol !== '' && /취소|거절|실패|cancel|reject|fail/i.test(row[statusCol] ?? '')) { cancelled++; continue; }
    if (String(row[amountCol] ?? '').trim() === '') { skipped++; continue; }
    const amount = parseAmount(row[amountCol]);
    const store = storeSelect === 'column' ? active.find(s=>normalize(s.name)===normalize(row[storeCol])) : active.find(s=>s.id===storeSelect);
    const period = dateCol === '' ? [year,month] : monthParts(row[dateCol],year);
    if (amount === null || !store || !period || !state.years.includes(period[0])) {
      if (issues.length < 8) issues.push(rowName + '행');
      skipped++; continue;
    }
    const id = key(...period,store.id,channel);
    if (!detail && amounts.has(id)) {
      fail(rowName + '행에서 같은 매장·월이 반복됩니다. 일자별 또는 주문별 자료면 금액 합산 방식으로 바꾸고, 합계 행이 섞여 있으면 파일에서 제거해 주세요.'); return;

  out.innerHTML = '<p class="notice">' + channels[channel] + ' · ' + entries + '행을 월별 금액 ' + pending.length + '건으로 정리했습니다. 취소 제외 ' + cancelled + '행 · 건너뜀 ' + skipped + '행' + (issues.length ? '<br>날짜·금액·매장명을 확인할 행 ' + issues.join(', ') : '') + '</p><div class="table-wrap"><table><thead><tr><th>매장</th><th>연월</th><th class="num">기존 금액</th><th class="num">반영 금액</th></tr></thead><tbody>' + tableRows + '</tbody></table></div>' + (pending.length>80?'<p class="muted">미리보기는 처음 80건까지 표시합니다.</p>':'') + '<div class="actions import-footer">' + (changed?'<label><input type="checkbox" id="overwrite"> 기존 금액 ' + changed + '건도 교체</label>':'') + button('금액 저장','apply-import','primary') + '</div>';
}
async function applyImport() {
  if (!pending?.length) return;
  const overwrite = !!$('#overwrite')?.checked;
  const next = structuredClone(state);
  let updated = 0, unchanged = 0;
  for (const row of pending) {
    const before = next.vals[row.id];
    if (before === row.amount || (before !== undefined && !overwrite)) { unchanged++; continue; }
    next.vals[row.id] = row.amount;
    updated++;
  }
  if (!updated) { notify('새로 반영할 금액이 없습니다.'); return; }
  if (await commit(next,'매출 ' + updated + '건을 저장했습니다. 기존 유지 ' + unchanged + '건')) {
    invalidatePreview();
    showImportStatus(upload.name + ' · 저장 완료');
  }
}

    return '<tr><td><button class="table-link" data-action="store-month" data-value="' + month + '" data-store="' + esc(id) + '">' + month + '월</button></td><td class="num">' + money(sum.hall) + '</td><td class="num">' + money(sum.delivery) + '</td><td class="num"><strong>' + money(sum.total) + '</strong></td></tr>';
  }).join('');
  modal.innerHTML = '<div class="dialog-body"><button type="button" class="close" data-action="close" aria-label="닫기">×</button><h2 id="modal-title">' + esc(store.name) + ' 월별 매출</h2><p class="muted">' + yearLabel(ui.year) + ' · ' + storeLabel(store.kind) + ' · 단위 원</p><div class="table-wrap import-meta"><table class="report-table"><thead><tr><th>월</th><th class="num">홀</th><th class="num">배달</th><th class="num">합계</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  modal.showModal();
}

function csv(data) {
  return '\uFEFF' + data.map(row=>row.map((value,i) => {
    let cell = String(value ?? '');
    if (typeof value === 'string' && /^[\s]*[=+@-]/.test(cell)) cell = "'" + cell;
    return '"' + cell.replace(/"/g,'""') + '"';
  }).join(',')).join('\r\n') + '\r\n';
}
function download(filename, text, type) {
  const url = URL.createObjectURL(new Blob([text],{type}));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}
function exportCsv() {
  const monthView = ui.view === 'monthly';
  const months = monthView ? [ui.month] : ui.period === 'all' ? monthList : [+ui.period];
  const stores = ui.view === 'overview' ? visibleStores() : groupStores();
  const rows = [['연도','월','매장명','매장 구분','브랜드',...channels,'합계']];
  for (const s of stores) for (const month of months) {
    const sum = collect(ui.year,[month],[s]);
    if (sum.total !== null) rows.push([yearLabel(ui.year),month+'월',s.name,storeLabel(s.kind),brandName(s.brand),...sum.amounts,sum.total]);
  }
  if (rows.length === 1) { notify('선택 범위에 내보낼 매출이 없습니다.'); return; }
  download('헤세드_매출_' + yearLabel(ui.year) + '.csv',csv(rows),'text/csv;charset=utf-8');
}
function render() {
  $('#export').hidden = !['overview','monthly'].includes(ui.view);
  document.querySelectorAll('[data-view]').forEach(el=>{
    const current = el.dataset.view===ui.view;
    el.classList.toggle('active',current);
    if (current) el.setAttribute('aria-current','page'); else el.removeAttribute('aria-current');
  });
  $('#content').innerHTML = {overview,monthly,import:importView,stores:storesView}[ui.view]();
  if (ui.view === 'overview') renderTrend();
  if (ui.view === 'import' && upload) syncImportColumns();
}
function navigate(view) {
  if (!(view in labels)) return;
  if (ui.view === 'import' && view !== 'import') { uploadSeq++; upload = null; pending = null; }
  ui.view = view;
  render();
  window.scrollTo(0,0);
  $('#content').focus({preventScroll:true});
}
function monthJump(month) { ui.month = Math.max(1,Math.min(12,+month)); navigate('monthly'); }
async function restoreFile(file) {
  if (!file) return;
  try {
    if (file.size > 20_000_000) throw Error('20MB 이하 백업을 사용해 주세요.');
    const raw = JSON.parse(await file.text());
    if (raw.app !== 'hesed-sales' || raw.version !== 1) throw Error('헤세드 매출관리에서 만든 백업 파일을 선택해 주세요.');
    const next = safeState(raw.state);
    dialog('백업 불러오기','선택한 백업으로 현재 매장과 매출 데이터를 교체합니다.','<div class="wide notice">' + esc(file.name) + ' · ' + next.stores.length + '개 매장 · 금액 ' + Object.keys(next.vals).length + '건</div>','교체 후 열기',async () => {
      if (!await commit(next,'백업 데이터를 불러왔습니다.')) return false;
      if (!state.years.includes(ui.year)) ui.year = state.years[0];
      ui.group = 'all'; ui.brand = 'all'; ui.search = ''; ui.period = 'all'; ui.trendStore=null;
      navigate('overview');
      return true;
    });
  } catch (e) { notify('백업을 읽을 수 없습니다. ' + e.message); }
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-view]');
  if (nav) { navigate(nav.dataset.view); return; }
  if (e.target.closest('#export')) { exportCsv(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (ui.view==='overview' && ui.trendStore && !e.target.closest('button,input,select,label,a,[data-drag],dialog,#trend')) selectTrend(null,false);
    return;
  }
  const {action,value,channel,store} = el.dataset;
  const actions = {
    group:()=>{ ui.group = value; ui.trendStore=null; render(); document.querySelector('[data-action="group"][data-value="'+value+'"]')?.focus(); },
    'open-month':()=>monthJump(ui.period==='all'?ui.month:ui.period),
    'open-import':()=>navigate('import'),
    'month-jump':()=>monthJump(value),
    'store-month':()=>{ modal.close(); monthJump(value); editSales(store); },
    'store-report':()=>selectTrend(value,true),
    'trend-reset':()=>selectTrend(null,false,true),
    'trend-details':()=>storeReport(value),
    'trend-month':()=>{ const id = ui.trendStore; monthJump(value); if (id) editSales(id); },
    theme:()=>applyTheme(document.documentElement.dataset.theme === 'black' ? 'light' : 'black',true),
    'move-store':()=>moveStore(value,el.dataset.target,el.dataset.edge),
    'toggle-order':()=>{
      ui.reorder = !ui.reorder;
      render();
      $('[data-action="toggle-order"]')?.focus({preventScroll:true});
    },
    'toggle-channels':()=>{ ui.channelsExpanded=!ui.channelsExpanded; render(); $('[data-action=toggle-channels]')?.focus(); },
    'edit-sales':()=>editSales(value,channel),
    'edit-store':()=>editStore(value),
    'delete-store':()=>setStoreDeleted(value,true),
    'restore-store':()=>setStoreDeleted(value,false),
    'add-year':addYear,
    'preview-import':previewImport,
    'save-format':saveImportFormat,
    'apply-import':applyImport,
    close:()=>modal.close(),
    backup:()=>download('헤세드_매출관리_백업.json',JSON.stringify({app:'hesed-sales',version:1,state},null,2),'application/json'),
    restore:()=>$('#backup-file').click(),
    template:()=>download('헤세드_매출_가져오기_양식.csv',csv([['월','매장명','매출액']]),'text/csv;charset=utf-8')
  };
  actions[action]?.();
});
document.addEventListener('change', e => {
  const {id,value,files} = e.target;
  if (id === 'year') { ui.year = value; render(); $('#year').focus(); }
  else if (id === 'brand') { ui.brand=value; ui.trendStore=null; render(); $('#brand').focus(); }
  else if (id === 'period') { ui.period = value; render(); $('#period').focus(); }
  else if (id === 'month') { ui.month = +value; render(); $('#month').focus(); }
  else if (id === 'report-file') openReport(files[0]);
  else if (id === 'channel') {
    importChannel = value;
    if (upload) {
      const index = upload.book.names.indexOf(formats[importChannel]?.sheet);
      if (index >= 0) $('#sheet').value = index;
      selectSheet(+$('#sheet').value);
    }
  }
  else if (id === 'sheet') selectSheet(+value);
  else if (id === 'header-row') syncImportColumns();
  else if (id === 'backup-file') { restoreFile(files[0]); e.target.value = ''; }
  else if (e.target.closest('#mapping')) {
    invalidatePreview();
    updateMappingVisibility();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { ui.search = e.target.value; $('#store-table').innerHTML = storeTable(); }
});
window.addEventListener('storage', e => {
  if (e.key !== storageKey) return;
  try {
    state = e.newValue ? safeState(JSON.parse(e.newValue)) : safeState(SEED);
    if (!state.years.includes(ui.year)) ui.year = state.years[0];
    if (modal.open) modal.close();
    render();
    notify('다른 탭에서 저장한 내용을 반영했습니다.');
  } catch { notify('다른 탭의 저장 데이터를 읽을 수 없습니다.'); }
});
let dragging;
let scrollFrame;
function clearDropHints() {
  document.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
}
function dropTarget(x,y) {
  const row = document.elementFromPoint(x,y)?.closest('[data-branch]');
  if (!row || row.dataset.branch===dragging.id || row.dataset.kind!==dragging.kind) return null;
  const rect = row.getBoundingClientRect();
  return {row,edge:y > rect.top + rect.height/2 ? 'after' : 'before'};
}
function markDropTarget() {
  clearDropHints();
  const target = dropTarget(dragging.x,dragging.y);
  if (target) target.row.classList.add('drop-'+target.edge);
}
function scrollWhileDragging() {
  if (!dragging) return;
  const y = dragging.y;
  const delta = y < 95 ? -Math.min(16,(95-y)/3) : y > innerHeight-65 ? Math.min(16,(y-innerHeight+65)/3) : 0;
  if (delta) {
    window.scrollBy(0,delta);
    markDropTarget();
  }
  scrollFrame = requestAnimationFrame(scrollWhileDragging);
}
document.addEventListener('pointerdown',event=>{
  const handle = event.target.closest('[data-drag]');
  if (!handle || event.button!==0 || dragging) return;
  event.preventDefault();
  dragging = {id:handle.dataset.drag,kind:handle.closest('[data-kind]').dataset.kind,
    pointer:event.pointerId,x:event.clientX,y:event.clientY};
  handle.setPointerCapture(event.pointerId);
  scrollFrame = requestAnimationFrame(scrollWhileDragging);
});
document.addEventListener('pointermove',event=>{
  if (event.pointerId!==dragging?.pointer) return;
  dragging.x = event.clientX;
  dragging.y = event.clientY;
  markDropTarget();
});
function finishDrag(event) {
  if (event.pointerId!==dragging?.pointer) return;
  const target = event.type==='pointerup' ? dropTarget(event.clientX,event.clientY) : null;
  const id = dragging.id;
  dragging = null;
  cancelAnimationFrame(scrollFrame);
  clearDropHints();
  if (target) moveStore(id,target.row.dataset.branch,target.edge);
}
document.addEventListener('pointerup',finishDrag);
document.addEventListener('pointercancel',finishDrag);
render();

</script>
